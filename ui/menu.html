<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="../../_kit/ducky.js"></script>
  <style>
    /* Opaque: a see-through page shows the iframe's white backdrop. The app never makes the
       dropdown shorter than 120 px, so the content is centred in whatever height it gets. */
    html, body { margin: 0; padding: 0; background: var(--card); overflow: hidden; }
    body { height: 100vh; display: flex; flex-direction: column; justify-content: center; }
    #box { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .hint { font-size: 11px; color: var(--muted); text-align: center; }
    .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.on { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent); }
    .t { font-weight: 600; font-size: 13px; white-space: nowrap; }
    .d { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; text-align: right;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btns { display: flex; gap: 6px; }
    .btns button { all: unset; box-sizing: border-box; flex: 1; height: 28px; padding: 0 10px;
      display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
      font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer;
      background: color-mix(in srgb, var(--fg) 6%, var(--card)); color: var(--fg); border: 1px solid var(--border); }
    .btns button:hover:not(:disabled) { border-color: var(--accent); }
    .btns button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .btns button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="box">
    <div class="row"><span class="dot" id="dot"></span><span class="t" id="title">Hand Mouse</span><span class="d" id="detail">Checking…</span></div>
    <div class="btns">
      <button class="primary" id="toggle" disabled>Start</button>
      <button id="open" title="Open the Hand Mouse panel">Open panel</button>
    </div>
    <div class="hint">Ctrl+Alt+G switches game mode</div>
  </div>
  <script>
    const CHANNEL = "uefn-plugin-ui";
    function call(method, params = {}) {
      const id = crypto.randomUUID();
      return new Promise((resolve, reject) => {
        function onMsg(ev) {
          const d = ev.data;
          if (!d || d.channel !== CHANNEL || d.id !== id) return;
          window.removeEventListener("message", onMsg);
          d.ok ? resolve(d.result) : reject(new Error(d.error || "bridge error"));
        }
        window.addEventListener("message", onMsg);
        parent.postMessage({ channel: CHANNEL, id, method, params }, "*");
      });
    }
    const rpc = (method, params = {}) => call("plugin.call", { method, params }).catch((e) => ({ ok: false, error: e.message }));
    const $ = (id) => document.getElementById(id);
    const LABEL = { move: "Moving", drag: "Dragging", scroll: "Scrolling", gesture: "Gesture", recording: "Recording",
      paused: "Paused (open palm to resume)", nohand: "Running · no hand in view", nocamera: "Running · no picture", starting: "Starting…" };
    let S = null, timer = 0, lastDot = null;

    async function tick() {
      clearTimeout(timer);
      const s = await rpc("status");
      if (s.ok !== false) {
        S = s;
        const on = !!s.running;
        $("dot").classList.toggle("on", on);
        const txt = s.error ? "Error: open panel"
          : s.warning ? s.warning
          : on ? `${LABEL[s.mode] || s.mode} · ${s.fps} fps`
          : s.setup !== "ready" ? "Setup needed" : "Stopped";
        $("detail").textContent = txt;
        $("detail").title = txt;
        $("toggle").textContent = on ? "Stop" : "Start";
        $("toggle").className = on ? "" : "primary";
        $("toggle").disabled = s.setup !== "ready";
        const dot = s.error ? "warn" : on ? "error" : "";  // "error" = the red dot
        if (dot !== lastDot) {
          lastDot = dot;
          call("header_menu_badge", { dot, count: 0 }).catch(() => {});
        }
      }
      timer = setTimeout(tick, S && S.running ? 1000 : 2500);
    }

    $("toggle").onclick = async () => {
      $("toggle").disabled = true;
      await rpc(S && S.running ? "stop" : "start");
      tick();
    };
    $("open").onclick = () => call("panel.open", { action: "panel:main" }).catch(() => {});
    window.addEventListener("DOMContentLoaded", () => {
      // The page loads while the dropdown is hidden (height 0), so report again once it shows.
      new ResizeObserver(() => {
        const h = $("box").offsetHeight;
        if (h) call("header_menu_size", { height: h }).catch(() => {});
      }).observe($("box"));
      tick();
    });
  </script>
</body>
</html>
